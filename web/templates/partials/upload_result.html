{% if notice %}
<div class="upload-result">
    <h4>{{ notice }}</h4>
</div>
{% else %}
<div class="upload-result error">
    <h4>❌ Processing Failed</h4>
    <p style="margin-top: 0.5rem; font-size: 0.9rem;">{{ error }}</p>
    {% if existing_id %}
    <div style="margin-top: 1rem;">
        <a href="/imports/{{ existing_id }}" class="btn btn-ghost btn-sm">Open import #{{ existing_id }} →</a>
    </div>
    {% endif %}
</div>
{% endif %}
